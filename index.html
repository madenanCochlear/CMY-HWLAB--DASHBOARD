<script>
  function resizeVisiblePlots() {
    const activeTab = document.querySelector('.tab-content.active');
    if (!activeTab) return;
    const plots = activeTab.querySelectorAll('.js-plotly-plot');
    plots.forEach(p => {
      try { Plotly.Plots.resize(p); } catch(e) {}
    });
  }

  function showTab(which) {
    document.getElementById('tab-util').classList.remove('active');
    document.getElementById('tab-perf').classList.remove('active');
    document.getElementById('btn-util').classList.remove('active');
    document.getElementById('btn-perf').classList.remove('active');

    if (which === 'util') {
      document.getElementById('tab-util').classList.add('active');
      document.getElementById('btn-util').classList.add('active');
    } else {
      document.getElementById('tab-perf').classList.add('active');
      document.getElementById('btn-perf').classList.add('active');
    }

    // Reflow the now-visible plots
    setTimeout(resizeVisiblePlots, 0);
  }

  // Also reflow on window resize
  window.addEventListener('resize', resizeVisiblePlots);
</script>
